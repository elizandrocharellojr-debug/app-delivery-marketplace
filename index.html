<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Login - Alloo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#00a868" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Alloo" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div class="app-shell login-shell">
      <main class="login-page">
        <section class="login-hero">
          <img src="./assets/icon.svg" alt="" class="login-logo" aria-hidden="true" />
          <h1 class="login-title">Alloo</h1>
        </section>

        <section class="form-card login-card">
          <div class="login-card-head">
            <h2 class="login-card-title" id="login-card-title">Entrar</h2>
          </div>

          <form id="login-form">
            <label class="field login-field">
              <span id="login-user-label">Email</span>
              <div class="login-input-wrap">
                <i class="fas fa-envelope"></i>
                <input type="text" id="login-username" placeholder="cliente@alloo.com" />
              </div>
            </label>
            <label class="field login-field">
              <span>Senha</span>
              <div class="login-input-wrap">
                <i class="fas fa-lock"></i>
                <input type="password" id="login-password" placeholder="" />
              </div>
            </label>
            <button class="primary-button" type="submit" id="login-submit-button">
              Entrar
            </button>
          </form>

          <div class="login-divider" id="google-signin-divider" hidden>
            <span>ou</span>
          </div>
          <div id="google-signin-container" class="google-signin-container" hidden></div>

          <div class="login-help-links" id="login-help-links">
            <button class="login-inline-link" type="button" id="open-register-button">
              Criar uma conta
            </button>
            <button class="login-inline-link" type="button" id="open-recovery-button">
              Esqueceu sua senha?
            </button>
            <button
              class="login-inline-link"
              type="button"
              data-login-role="estabelecimento"
              id="switch-to-owner-button"
            >
              É dono de um estabelecimento? Entrar aqui
            </button>
            <button
              class="login-inline-link"
              type="button"
              data-login-role="cliente"
              id="switch-to-customer-button"
              hidden
            >
              Sou cliente, entrar aqui
            </button>
          </div>

          <form id="register-form" class="login-secondary-form" hidden style="display: none">
            <label class="field login-field">
              <span>Nome</span>
              <div class="login-input-wrap">
                <i class="fas fa-user"></i>
                <input type="text" id="register-name" placeholder="Nome completo" />
              </div>
            </label>
            <label class="field login-field">
              <span>CPF</span>
              <div class="login-input-wrap">
                <i class="fas fa-id-card"></i>
                <input type="text" id="register-cpf" placeholder="" />
              </div>
            </label>
            <label class="field login-field">
              <span>Telefone</span>
              <div class="login-input-wrap">
                <i class="fas fa-phone"></i>
                <input type="tel" id="register-phone" placeholder="(41) 99999-9999" />
              </div>
            </label>
            <label class="field login-field">
              <span>CEP</span>
              <div class="login-input-wrap">
                <i class="fas fa-mail-bulk"></i>
                <input type="text" id="register-zip" placeholder="" />
              </div>
            </label>
            <label class="field login-field">
              <span>Rua</span>
              <div class="login-input-wrap">
                <i class="fas fa-road"></i>
                <input type="text" id="register-street" placeholder="" />
              </div>
            </label>
            <div class="login-grid-two">
              <label class="field login-field">
                <span>Número</span>
                <div class="login-input-wrap">
                  <i class="fas fa-hashtag"></i>
                  <input type="text" id="register-number" placeholder="" />
                </div>
              </label>
              <label class="field login-field">
                <span>Bairro</span>
                <div class="login-input-wrap">
                  <i class="fas fa-location-dot"></i>
                  <input type="text" id="register-district" placeholder="" />
                </div>
              </label>
            </div>
            <label class="field login-field">
              <span>Cidade</span>
              <div class="login-input-wrap">
                <i class="fas fa-city"></i>
                <select id="register-city" required>
                  <option value="" selected disabled>Selecione a cidade</option>
                  <option value="Antonina">Antonina</option>
                  <option value="Guaraqueçaba">Guaraqueçaba</option>
                  <option value="Guaratuba">Guaratuba</option>
                  <option value="Matinhos">Matinhos</option>
                  <option value="Morretes">Morretes</option>
                  <option value="Paranaguá">Paranaguá</option>
                  <option value="Pontal do Paraná">Pontal do Paraná</option>
                </select>
              </div>
            </label>
            <label class="field login-field">
              <span>Complemento / ponto de referência (opcional)</span>
              <div class="login-input-wrap">
                <i class="fas fa-map-pin"></i>
                <input
                  type="text"
                  id="register-complement"
                  placeholder="Ex: Apto 12, perto da praça"
                />
              </div>
            </label>
            <label class="field login-field">
              <span>Email</span>
              <div class="login-input-wrap">
                <i class="fas fa-envelope"></i>
                <input type="email" id="register-email" placeholder="" />
              </div>
            </label>
            <label class="field login-field">
              <span>Senha</span>
              <div class="login-input-wrap">
                <i class="fas fa-lock"></i>
                <input type="password" id="register-password" placeholder="" />
              </div>
            </label>
            <label class="field login-field">
              <span>Repita a senha</span>
              <div class="login-input-wrap">
                <i class="fas fa-lock"></i>
                <input type="password" id="register-password-confirm" placeholder="" />
              </div>
            </label>
            <div class="login-secondary-actions">
              <button class="secondary-button" type="button" id="close-register-button">
                Cancelar
              </button>
              <button class="primary-button" type="submit">Criar conta</button>
            </div>
          </form>

          <div class="inline-message" id="login-message"></div>
        </section>
      </main>
    </div>

    <script src="./src/data/seed.js"></script>
    <script src="./src/data/database.js"></script>
    <script src="./src/push.js"></script>
    <script src="./src/login.js"></script>
  </body>
</html>
