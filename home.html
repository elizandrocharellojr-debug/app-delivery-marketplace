<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Alloo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#00a868" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Alloo" />
  </head>
  <body>
    <div class="app-shell simple-home-shell customer-shell">
      <header class="app-header home-header-v2">
        <div class="home-utility-row">
          <button class="icon-circle-button" type="button" id="home-back-button" aria-label="Voltar">
            <i class="fas fa-arrow-left"></i>
          </button>
        </div>

        <div class="home-header-top">
          <button class="home-address-button" type="button" id="home-address-button" aria-label="Endereço de entrega">
            <span class="home-address-copy">
              <span class="home-address-label">Entregar em</span>
              <strong class="home-address-value" id="home-address-value">Adicionar endereço</strong>
            </span>
            <i class="fas fa-chevron-down"></i>
          </button>
          <img src="./assets/logo-wordmark.png" alt="Alloo" class="home-brand-mark" />
        </div>

        <form class="search-container" id="search-form">
          <i class="fas fa-search search-icon"></i>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Busque lojas, comida ou serviços"
            aria-label="Buscar lojas, comida ou serviços"
          />
        </form>

        <div class="home-tabs" role="tablist">
          <button type="button" class="home-tab active" data-tab="estabelecimentos" id="tab-estabelecimentos">
            Estabelecimentos
          </button>
          <button type="button" class="home-tab" data-tab="servicos" id="tab-servicos">Serviços</button>
        </div>
      </header>

      <main class="home-content">
        <section class="categories-section" id="categories-section">
          <div class="home-chip-row" id="categories"></div>
        </section>

        <section class="nearby-section">
          <div class="section-header">
            <h2 id="nearby-title">Perto de você</h2>
            <a href="./category.html?category=comida" class="section-header-link" id="nearby-see-all">Ver tudo</a>
          </div>
          <div class="nearby-list" id="nearby-list"></div>
        </section>
      </main>

      <a class="floating-cart-button hidden" href="./cart.html" id="global-floating-cart-button">
        <span class="floating-cart-info">
          <i class="fas fa-shopping-cart"></i>
          <span id="global-floating-cart-count">0</span> item(ns)
        </span>
        <span class="floating-cart-label">Ver carrinho <i class="fas fa-chevron-right"></i></span>
      </a>

      <nav class="bottom-nav">
        <a class="nav-item active" href="./home.html">
          <i class="fas fa-home"></i>
          <span>Início</span>
        </a>
        <a class="nav-item" href="./buscar.html">
          <i class="fas fa-search"></i>
          <span>Buscar</span>
        </a>
        <a class="nav-item" href="./orders.html">
          <i class="fas fa-cube"></i>
          <span>Pedidos</span>
        </a>
        <a class="nav-item" href="./profile.html">
          <i class="fas fa-user"></i>
          <span>Perfil</span>
        </a>
      </nav>
    </div>

    <script src="./src/data/seed.js"></script>
    <script src="./src/data/database.js"></script>
    <script src="./src/push.js"></script>
    <script src="./src/cart-floating.js"></script>
    <script src="./src/app.js"></script>
  </body>
</html>
