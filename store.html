<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Loja - Morretes Delivery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#00a868" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Alloo" />
  </head>
  <body>
    <div class="app-shell store-shell">
      <header class="app-header category-header">
        <div class="header-top">
          <a href="./home.html" class="back-btn" aria-label="Voltar para inicio">
            <i class="fas fa-arrow-left"></i>
          </a>
          <div class="brand-block category-brand">
            <span class="brand-subtitle">Morretes - PR</span>
            <strong class="brand-title" id="store-title">Loja</strong>
          </div>
          <button class="action-btn" title="Favoritar" type="button" id="favorite-button">
            <i class="fas fa-heart"></i>
          </button>
        </div>

        <div class="store-hero-card">
          <div class="store-hero-main">
            <div class="store-hero-logo" id="store-icon"></div>
            <div>
              <div class="store-status-badge" id="store-status-badge">Loja aberta</div>
              <strong id="store-name">Loja</strong>
              <p id="store-description">Produtos e informações da loja.</p>
            </div>
          </div>
          <div class="store-hero-summary">
            <div class="store-hero-chip" id="store-hours"></div>
            <div class="store-hero-chip" id="store-time"></div>
            <div class="store-hero-chip" id="store-fee"></div>
            <div class="store-hero-chip" id="store-min-order"></div>
          </div>
          <div class="store-social-links" id="store-social-links"></div>
        </div>
      </header>

      <main class="home-content">
        <section class="stores-section">
          <div class="store-rating-summary" id="store-rating-summary"></div>
          <div class="section-header">
            <h2>Itens</h2>
          </div>
          <input
            type="search"
            id="store-item-search-input"
            class="address-input"
            placeholder="Buscar item nesta loja"
          />
          <div class="items-list" id="store-items-list"></div>
        </section>
        <div class="inline-message" id="store-message"></div>
        <section class="stores-section" id="store-reviews-section"></section>
      </main>

      <a class="floating-cart-button hidden" href="./cart.html" id="store-cart-floating-button">
        <i class="fas fa-shopping-cart"></i>
        <span id="store-cart-floating-count">0</span>
      </a>

      <nav class="bottom-nav">
        <a class="nav-item" href="./home.html">
          <i class="fas fa-home"></i>
          <span>Início</span>
        </a>
        <a class="nav-item" href="./buscar.html">
          <i class="fas fa-search"></i>
          <span>Buscar</span>
        </a>
        <a class="nav-item" href="./orders.html">
          <i class="fas fa-cube"></i>
          <span>Pedidos</span>
        </a>
        <a class="nav-item" href="./profile.html">
          <i class="fas fa-user"></i>
          <span>Perfil</span>
        </a>
      </nav>
    </div>

    <script src="./src/data/seed.js"></script>
    <script src="./src/data/database.js"></script>
    <script src="./src/push.js"></script>
    <script src="./src/cart-floating.js"></script>
    <script src="./src/store.js"></script>
    <script src="./src/back.js"></script>
  </body>
</html>
