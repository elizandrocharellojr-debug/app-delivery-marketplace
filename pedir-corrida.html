<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Pedir corrida - Alloo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#00a868" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Alloo" />
  </head>
  <body>
    <div class="app-shell cart-shell">
      <header class="app-header category-header">
        <div class="header-top">
          <a href="./home.html" class="back-btn" aria-label="Voltar para início">
            <i class="fas fa-arrow-left"></i>
          </a>
          <div class="brand-block category-brand">
            <span class="brand-subtitle">Táxi</span>
            <strong class="brand-title">Pedir corrida</strong>
          </div>
          <span class="action-btn-spacer"></span>
        </div>
      </header>

      <main class="home-content">
        <section class="stores-section" id="ride-request-screen">
          <div class="form-card">
            <p class="muted-copy" style="margin: 0;">
              Seu local é detectado automaticamente e o valor da corrida já aparece fechado, antes de você
              confirmar o pedido - igual a Uber.
            </p>

            <div class="ride-pickup-status">
              <i class="fas fa-location-crosshairs"></i>
              <span id="ride-pickup-hint">Localizando você...</span>
            </div>

            <label class="field ride-place-field">
              <span>Rua ou ponto de referência de onde você está</span>
              <input type="text" id="ride-pickup-label-input" placeholder="Ex.: Rua XV de Novembro, em frente ao mercado" autocomplete="off" />
              <div class="ride-suggestions" id="ride-pickup-suggestions" hidden></div>
            </label>

            <label class="field ride-place-field">
              <span>Para onde você vai?</span>
              <input type="text" id="ride-destination-input" placeholder="Digite o destino..." autocomplete="off" />
              <div class="ride-suggestions" id="ride-destination-suggestions" hidden></div>
            </label>

            <div id="ride-confirmation-map" class="taxi-map" hidden></div>
            <p class="muted-copy ride-fare-estimate-box" id="ride-fare-estimate-hint" hidden></p>

            <label class="field">
              <span>Seu nome</span>
              <input type="text" id="ride-name-input" placeholder="" />
            </label>
            <label class="field">
              <span>Telefone de contato</span>
              <input type="text" id="ride-phone-input" placeholder="" />
            </label>
            <label class="field">
              <span>Observações (opcional)</span>
              <textarea class="field-textarea" id="ride-notes-input" rows="3" placeholder="Ponto de referência, quantas pessoas, bagagem..."></textarea>
            </label>

            <label class="field">
              <span>Pagamento</span>
              <select class="field-select" id="ride-payment-method">
                <option value="Dinheiro">Dinheiro</option>
                <option value="Pix">Pix</option>
                <option value="Cartão">Cartão (crédito ou débito)</option>
              </select>
            </label>

            <button class="primary-button" type="button" id="ride-request-submit-button">Chamar táxi</button>
            <div class="inline-message" id="ride-request-message"></div>
          </div>
        </section>

        <section class="stores-section" id="ride-tracking-screen" hidden>
          <div class="form-card">
            <div class="section-header">
              <h2>Sua corrida</h2>
              <span class="status-pill" id="ride-status-pill">-</span>
            </div>

            <div id="ride-tracking-map" class="taxi-map"></div>

            <div id="ride-tracking-details"></div>

            <button class="secondary-button danger-button" type="button" id="ride-cancel-button">Cancelar corrida</button>
            <div class="inline-message" id="ride-tracking-message"></div>
          </div>
        </section>
      </main>
    </div>

    <div id="ride-payment-modal-overlay" class="payment-modal-overlay" hidden>
      <div class="payment-modal">
        <button class="icon-circle-button payment-modal-close" type="button" id="ride-payment-modal-close-button" aria-label="Fechar">
          <i class="fas fa-times"></i>
        </button>
        <div id="ride-payment-modal-content"></div>
      </div>
    </div>

    <script src="./src/data/seed.js"></script>
    <script src="./src/data/database.js"></script>
    <script src="./src/back.js"></script>
    <script src="./src/pedir-corrida.js"></script>
  </body>
</html>
