<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Recuperar senha - Alloo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#00a868" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Alloo" />
  </head>
  <body>
    <div class="app-shell login-shell">
      <main class="login-page">
        <section class="login-hero">
          <h1 class="login-title">Alloo</h1>
        </section>

        <section class="form-card login-card">
          <div class="login-card-head">
            <h2 class="login-card-title">Recuperar senha</h2>
          </div>

          <form id="forgot-password-form" class="login-secondary-form" style="display: grid">
            <label class="field login-field">
              <span>E-mail</span>
              <div class="login-input-wrap">
                <i class="fas fa-envelope"></i>
                <input type="email" id="forgot-email" placeholder="Digite seu e-mail" />
              </div>
            </label>
            <div class="login-secondary-actions">
              <a class="secondary-button back-link" href="./index.html" id="forgot-password-back-link">Voltar</a>
              <button class="primary-button" type="submit">Enviar link</button>
            </div>
          </form>

          <div class="inline-message" id="forgot-password-message"></div>
        </section>
      </main>
    </div>

    <script src="./src/forgot-password.js"></script>
    <script src="./src/back.js"></script>
  </body>
</html>
