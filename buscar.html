<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Buscar - Alloo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#00a868" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Alloo" />
  </head>
  <body>
    <div class="app-shell customer-shell">
      <header class="app-header">
        <div class="home-utility-row">
          <a class="icon-circle-button" href="./home.html" aria-label="Voltar para inicio">
            <i class="fas fa-arrow-left"></i>
          </a>
          <a class="icon-circle-button" href="./profile.html" aria-label="Mais opções">
            <i class="fas fa-ellipsis"></i>
          </a>
        </div>

        <h1 class="buscar-title">Buscar</h1>

        <form class="search-container" id="buscar-form">
          <i class="fas fa-search search-icon"></i>
          <input
            type="search"
            id="buscar-input"
            class="search-input"
            placeholder="Pizza, manicure, pedreiro..."
            aria-label="Buscar lojas, comida ou serviços"
          />
        </form>
      </header>

      <main class="home-content">
        <section id="buscar-categories-section">
          <div class="section-header"><h2>Categorias</h2></div>
          <div class="buscar-category-grid" id="buscar-category-grid"></div>
        </section>

        <section id="buscar-results-section" hidden>
          <div class="section-header">
            <h2 id="buscar-results-title">Resultados</h2>
            <a href="#" class="section-header-link" id="buscar-clear-link">Categorias</a>
          </div>
          <div id="buscar-results-stores"></div>
          <div id="buscar-results-providers"></div>
        </section>
      </main>

      <nav class="bottom-nav">
        <a class="nav-item" href="./home.html">
          <i class="fas fa-home"></i>
          <span>Início</span>
        </a>
        <a class="nav-item active" href="./buscar.html">
          <i class="fas fa-search"></i>
          <span>Buscar</span>
        </a>
        <a class="nav-item" href="./orders.html">
          <i class="fas fa-cube"></i>
          <span>Pedidos</span>
        </a>
        <a class="nav-item" href="./profile.html">
          <i class="fas fa-user"></i>
          <span>Perfil</span>
        </a>
      </nav>
    </div>

    <script src="./src/data/seed.js"></script>
    <script src="./src/data/database.js"></script>
    <script src="./src/push.js"></script>
    <script src="./src/buscar.js"></script>
  </body>
</html>
